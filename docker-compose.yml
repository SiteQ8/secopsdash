version: '3.8'

services:
  secopsdash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secopsdash
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    labels:
      - "com.secopsdash.description=Security Operations Dashboard"
      - "com.secopsdash.version=1.0.0"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: secopsdash-network
